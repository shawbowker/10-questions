<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>10 Questions</title>
</head>

<body>
  <h1>10 Questions!</h1>
  <section id="info">
    <button id="start-quiz">Start Quiz</button>
    <select id="selectedCategory">
      <option value="">Select a Category... (random by default)</option>
    </select>
    <select id="selectedDifficulty">
      <option value="">Select a Difficulty... (random by default)</option>
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
  </section>

  <section id="questions">

  </section>
  <section id="results">

  </section>
  <button id="finish-quiz">Results</button>
  <script src="./script.js"></script>
</body>

</html>
